<div class="flex flex-col justify-center mt-10 gap-7 pl-[398px]">
  <header class="flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <span class="text-sm text-[var(--text-muted)] font-semibold">Cursos</span>
      <img
        class="w-[12px] shrink-0"
        src="/ChevronRight.svg"
        alt="Seta indicando navegação para a direita"
      />
      <span class="text-[var(--text-medium)] font-semibold">Novo curso</span>
    </div>

    <!-- Título -->
    <h1 class="text-[32px] font-bold leading-none text-[var(--text-high)]">Criar novo curso</h1>

    <!-- Subtítulo -->
    <p class="text-sm text-[var(--text-medium)] font-normal">
      Preencha as informações e organize o conteúdo em módulos e aulas
    </p>
  </header>

  <app-course-form-section-one-info />
  <app-course-form-section-two-modules />

  <div class="flex items-end justify-end gap-3 pb-7">
    <button
      type="button"
      class="inline-flex items-center justify-center gap-2 rounded-[6px] border border-[var(--border)] bg-[var(--bg-900)] pt-[9.5px] pr-[20px] pb-[10px] pl-[20px] text-white hover:bg-[var(--border)] hover:border-[var(--border)] hover:shadow-[0_0_20px_rgba(42,48,64,0.60)] focus:outline-none focus:ring-1 focus:ring-[var(--text-muted)]"
    >
      Cancelar
    </button>

    <button
      type="button"
      routerLink="/courses/new"
      class="inline-flex items-center justify-center gap-2 rounded-[6px] bg-[var(--primary)] pt-[9.5px] pr-[15.333px] pb-[10.5px] pl-[20px] text-white transition-shadow ease-out hover:bg-[#00C98B] hover:shadow-[0_0_20px_rgba(0,179,126,0.30)] focus:outline-none focus:ring-2 focus:ring-[rgba(0,179,126,0.25)]"
    >
      Criar Curso
    </button>
  </div>
</div>
