<!-- O container principal do card. As classes de layout (grid/flex) virão do componente pai. -->
<article
  class="flex flex-col gap-4 rounded-lg border border-[var(--border)] bg-[var(--surface-primary)] p-5 transition-all hover:border-[var(--primary)]"
>
  <!-- Seção Superior: Categoria e Botões de Ação -->
  <header class="flex items-center justify-between">
    <span
      class="flex items-center justify-center rounded-full px-3 py-1 text-xs font-semibold text-[var(--primary)] border border-[var(--border)] bg-[var(--bg-start)] hover:border transition-colors"
    >
      {{ course.category | uppercase }}
    </span>
    <div class="flex items-center gap-2">
      <button
        (click)="onEdit()"
        aria-label="Editar curso"
        class="group rounded p-1.5 text-[var(--text-low)] transition-colors hover:bg-[var(--surface-secondary)] hover:text-[var(--text-high)]"
      >
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
          <path d="m15 5 4 4" />
        </svg>
      </button>
      <button
        (click)="onDelete()"
        aria-label="Excluir curso"
        class="group rounded p-1.5 text-[var(--text-low)] transition-colors hover:bg-[var(--surface-secondary)] hover:text-[var(--text-high)]"
      >
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M3 6h18" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Seção de Conteúdo: Título e Descrição -->
  <main class="flex flex-col gap-2">
    <h3 class="text-lg font-bold text-[var(--text-high)]">
      {{ course.name }}
    </h3>
    <p class="text-sm text-[var(--text-medium)]">
      {{ course.description }}
    </p>
  </main>

  <!-- Seção Inferior: Metadados do Curso -->
  <footer class="flex items-center gap-6 border-t border-[var(--border)] pt-4">
    <div class="flex items-center gap-2 text-sm text-[var(--text-medium)]">
      <svg
        class="h-4 w-4 text-[var(--primary)]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M10 3H3V10H10V3Z" />
        <path d="M21 3H14V10H21V3Z" />
        <path d="M10 14H3V21H10V14Z" />
        <path d="M21 14H14V21H21V14Z" />
      </svg>
      <span>{{ course.modules.length }} módulos</span>
    </div>
    <div class="flex items-center gap-2 text-sm text-[var(--text-medium)]">
      <svg
        class="h-4 w-4 text-[var(--primary)]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M23 7L16 12L23 17V7Z" />
        <path
          d="M14 5H3C1.89543 5 1 5.89543 1 7V17C1 18.1046 1.89543 19 3 19H14C15.1046 19 16 18.1046 16 17V7C16 5.89543 15.1046 5 14 5Z"
        />
      </svg>

      <span>{{ getTotalLessons() }} aulas</span>
    </div>
  </footer>
</article>
