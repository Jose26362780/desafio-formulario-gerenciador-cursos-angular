<div class="flex flex-col items-start pt-6 gap-6 self-stretch w-full">
  @for (modulo of modulos; track modulo.id) {
    <div
      class="flex flex-col items-start self-stretch rounded-xl border border-[var(--border)] overflow-hidden w-full shrink-0"
    >
      <div
        class="flex items-center justify-between p-5 self-stretch border-b bg-[var(--surface-900)] border-[var(--border)]"
      >
        <div class="flex items-center gap-4">
          <span class="text-[var(--primary)] font-mono font-bold text-lg leading-none">
            {{ modulo.numero }}
          </span>
          <h3 class="text-[var(--text-high)] font-semibold text-base leading-none">
            {{ modulo.titulo }}
          </h3>
        </div>
        <span class="text-[var(--text-medium)] text-xs font-medium">
          {{ modulo.aulas.length }} aulas
        </span>
      </div>

      <div class="flex flex-col self-stretch bg-[var(--surface-800)]">
        @for (aula of modulo.aulas; track aula.id) {
          <div
            class="flex items-center gap-4 px-5 py-3 cursor-pointer transition-colors hover:bg-[var(--surface-900)] w-full"
          >
            <div class="w-1.5 h-1.5 rounded-full bg-[var(--primary)] opacity-80"></div>
            <span class="text-[var(--text-muted)] font-bold text-sm">
              {{ aula.numero }}
            </span>
            <p class="text-[var(--text-medium)] text-sm">
              {{ aula.titulo }}
            </p>
          </div>
        }
      </div>
    </div>
  }
</div>
