<section
  class="flex w-[1136px] h-[343px] shrink-0 flex-col items-start gap-[24.1px] rounded-[14px] border border-[var(--border)] bg-[var(--surface-800)] pt-[27.9px] px-7 pb-7"
  [formGroup]="informationsFormGroup"
>
  <header class="flex items-start gap-4">
    <span class="text-[32px] font-bold leading-none text-[var(--primary)]">01</span>

    <div class="flex flex-col gap-1">
      <h2 class="text-lg font-bold text-[var(--text-high)]">Informações do curso</h2>
      <p class="text-sm text-[var(--text-medium)]">Dados gerais que identificam o curso</p>
    </div>
  </header>

  <div class="flex w-full flex-col gap-6">
    <div class="grid w-full grid-cols-2 gap-6">
      <div class="flex flex-col gap-2">
        <label class="label-uppercase" for="course-name">
          Nome do curso <span class="text-[var(--danger)]">*</span>
        </label>
        <input
          id="course-name"
          formControlName="name"
          type="text"
          class="w-full text-sm text-[var(--text-high)] outline-none !border-transparent rounded-[6px] focus:!border-[var(--primary)] focus:shadow-[0_0_0_2.613px_rgba(0,179,126,0.10)] transition-all duration-300 ease-out"
          placeholder="Ex: Desenvolvimento Web Fullstack"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="label-uppercase" for="course-category">Categoria</label>
        <input
          id="course-category"
          formControlName="category"
          type="text"
          class="w-full text-sm text-[var(--text-high)] outline-none !border-transparent rounded-[6px] focus:!border-[var(--primary)] focus:shadow-[0_0_0_2.613px_rgba(0,179,126,0.10)] transition-all duration-300 ease-out"
          placeholder="Ex: Frontend, Backend..."
        />
      </div>
    </div>

    <!-- Linha 2: Descrição -->
    <div class="flex w-full flex-col gap-2">
      <label class="label-uppercase" for="course-description">
        Descrição <span class="text-[var(--danger)]">*</span>
      </label>
      <textarea
        id="course-description"
        formControlName="description"
        class="textarea w-full text-sm text-[var(--text-high)] outline-none !border-transparent rounded-[6px] focus:!border-[var(--primary)] focus:shadow-[0_0_0_2.613px_rgba(0,179,126,0.10)] transition-all duration-300 ease-out"
        placeholder="Descreva o curso (mínimo 10 caracteres)"
      ></textarea>
    </div>
  </div>
</section>
