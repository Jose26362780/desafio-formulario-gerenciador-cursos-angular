<div class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm z-50">
  <!-- Modal Container -->
  <div
    class="bg-[var(--surface-800)] rounded-lg border border-[var(--border)] p-6 w-[420px] h-[310px] flex flex-col justify-between"
  >
    <!-- Header com Ícone -->
    <div class="flex flex-col items-center gap-4 mb-6">
      <div
        class="flex items-center justify-center w-16 h-16 rounded-lg bg-[rgba(247,90,104,0.1)] border border-[color:var(--danger)]"
      >
        <svg
          class="w-8 h-8 text-[color:var(--danger)]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M3 6H5H21" />
          <path
            d="M19 6L18.1429 19.1429C18.1429 19.6883 17.9261 20.2114 17.5403 20.5972C17.1546 20.983 16.6314 21.2 16.0857 21.2H7.91429C7.36863 21.2 6.84547 20.983 6.45968 20.5972C6.07389 20.2114 5.85714 19.6883 5.85714 19.1429L5 6"
          />
          <path d="M10 11V17M14 11V17" stroke-width="2" />
        </svg>
      </div>

      <h2 class="text-xl font-bold text-[var(--text-high)] text-center">Excluir curso</h2>
    </div>

    <!-- Content -->
    <div class="mb-6 text-center">
      <p class="text-sm text-[var(--text-medium)]">
        Tem certeza que deseja excluir
        <span class="font-semibold text-[var(--text-high)]">"{{ courseName }}"</span>
        ? Esta ação não pode ser desfeita.
      </p>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-center gap-3 w-full">
      <button
        type="button"
        (click)="onCancel()"
        class="flex w-[91.65px] h-[43px] px-[20px] py-[10px] justify-center items-center gap-[8px] flex-shrink-0 rounded-[6px] border border-[var(--border)] bg-transparent text-[var(--text-medium)] font-semibold transition-colors hover:bg-[var(--surface-700)] hover:border-[var(--text-medium)]"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="onConfirmDelete()"
        class="w-[116px] h-[43px] flex items-center justify-center gap-[6px] rounded-[6px] border border-[var(--danger)] bg-[rgba(247,90,104,0.12)] text-[var(--danger)] font-semibold transition-all hover:bg-[rgba(247,90,104,0.25)] hover:border-[var(--danger)]"
      >
        <img src="/tras.svg" alt="Ícone lixeira" class="w-4 h-4" />
        Excluir
      </button>
    </div>
  </div>
</div>
